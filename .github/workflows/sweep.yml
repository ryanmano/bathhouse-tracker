name: prestart-sweep

# Lightweight pre-start check: snapshot only the sessions starting in the next
# few minutes — captures the final booking rush right before class begins.
#
# Triggered by BOTH the Supabase pg_cron scheduler (primary, reliable when
# healthy) and GitHub's own cron (backup). The GitHub backup was re-added after
# the Supabase scheduler silently died on 2026-07-21, which — with no backup —
# left the sweep completely dead for days.
on:
  schedule:
    - cron: "2-57/5 9-23 * * *"  # ~every 5 min, 5:00am-7:55pm ET (EDT)
    - cron: "2-57/5 0-3 * * *"   # ~every 5 min, 8:00pm-11:55pm ET (EDT)
  workflow_dispatch: {}

# Never let queued runs pile up and cancel each other; a run either starts or
# is skipped, and the next dispatch (5 min later) covers any gap.
concurrency:
  group: prestart-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-start sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run.py --sweep
